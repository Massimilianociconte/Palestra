<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connessione Google Fit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            background: #ef4444;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Connessione in corso...</h2>
        <p id="status">Autenticazione con Google Fit</p>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        // Estrai parametri da URL query string (Authorization Code Flow)
        const urlParams = new URLSearchParams(window.location.search);
        const rawCode = urlParams.get('code');
        const rawError = urlParams.get('error');

        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error');

        // SECURITY P0.3/P2.29: Validate OAuth code before using it
        // Google returns url-safe chars: [A-Za-z0-9_/.\-]
        // Length is typically 30-500 chars
        const OAUTH_CODE_RE = /^[A-Za-z0-9_./-]{10,2048}$/;
        const OAUTH_ERROR_RE = /^[a-zA-Z0-9_-]{1,64}$/;

        const code = (typeof rawCode === 'string' && OAUTH_CODE_RE.test(rawCode)) ? rawCode : null;
        const error = (typeof rawError === 'string' && OAUTH_ERROR_RE.test(rawError)) ? rawError : (rawError ? 'invalid_error_param' : null);

        // SECURITY P0.3: Restrict postMessage to the known parent origin.
        // The callback is hosted on the same origin as the parent webapp, so
        // window.location.origin is the correct restrictive target.
        const TRUSTED_ORIGIN = window.location.origin;

        // Funzione per salvare in localStorage (fallback per COOP)
        function saveToLocalStorage(success, savedCode, savedError) {
            try {
                if (success) {
                    localStorage.setItem('fit_auth_success', 'true');
                    localStorage.setItem('fit_auth_code', savedCode);
                    console.log('✅ Auth data saved to localStorage');
                } else {
                    localStorage.setItem('fit_auth_error', savedError || 'unknown_error');
                    console.log('❌ Auth error saved to localStorage');
                }
            } catch (e) {
                console.error('Cannot write to localStorage:', e);
            }
        }

        // Funzione per tentare di chiudere la finestra
        function tryCloseWindow(delay = 1000) {
            setTimeout(() => {
                try {
                    window.close();
                } catch (e) {
                    console.log('Cannot close window (COOP restriction)');
                    // Mostra messaggio all'utente
                    statusEl.textContent = '✅ Puoi chiudere questa finestra';
                }
            }, delay);
        }

        function notifyParent(payload) {
            if (!window.opener) return;
            try {
                // SECURITY P0.3: never use '*' as targetOrigin with sensitive data
                window.opener.postMessage(payload, TRUSTED_ORIGIN);
            } catch (e) {
                console.log('postMessage blocked by COOP, using localStorage fallback');
            }
        }

        if (error) {
            // Errore OAuth
            statusEl.textContent = 'Errore durante l\'autenticazione';
            errorEl.textContent = `Errore: ${error}`;
            errorEl.style.display = 'block';

            saveToLocalStorage(false, null, error);
            notifyParent({ type: 'oauth_error', error: error });
            tryCloseWindow(3000);
        } else if (code) {
            // Successo - invia code al parent
            statusEl.textContent = 'Autenticazione completata!';

            saveToLocalStorage(true, code, null);
            notifyParent({ type: 'oauth_success', code: code });
            tryCloseWindow(1500);
        } else if (rawCode || rawError) {
            // Parametro presente ma non valido: scartiamo per sicurezza
            statusEl.textContent = 'Parametri non validi';
            errorEl.textContent = 'Il parametro di autorizzazione ricevuto non è in un formato valido.';
            errorEl.style.display = 'block';
            saveToLocalStorage(false, null, 'invalid_callback_params');
            notifyParent({ type: 'oauth_error', error: 'invalid_callback_params' });
            tryCloseWindow(3000);
        } else {
            // Nessun parametro
            statusEl.textContent = 'Parametri mancanti';
            errorEl.textContent = 'URL di callback non valido';
            errorEl.style.display = 'block';
            tryCloseWindow(3000);
        }
    </script>

    <!-- Footer -->
    <footer class="section" style="border-top: 1px solid var(--color-border); padding: 2rem 0; margin-top: 4rem;">
        <div class="container text-center">
            <p>Realizzato da <a href="https://webnovis.com">WebNovis</a> — 
            Agenzia web a Rho, Milano</p>
            <p>Vuoi un sito professionale? 
            <a href="https://webnovis.com/contatti">Contattaci</a></p>
        </div>
    </footer>

</body>

</html>
